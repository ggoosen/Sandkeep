# Release to PyPI via Trusted Publisher (improvement plan, step 22).
#
# Triggered by pushing a version tag (v0.1.0, …). Builds the sdist+wheel and
# publishes with PyPI's OIDC Trusted Publisher — no long-lived API token in the
# repo. Configure the trusted publisher once at
# https://pypi.org/manage/project/sandkeep/settings/publishing/ (workflow name
# release.yml, environment `pypi`). Rehearse against TestPyPI first by pointing
# the publish step at the testpypi repository-url.
#
# NOTE: the boundary suite gates merges via ci.yml; this workflow assumes the
# tagged commit is already green.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi        # gate on the protected `pypi` environment
    permissions:
      id-token: write        # OIDC token for the Trusted Publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # no token needed — Trusted Publisher exchanges the OIDC id-token
