[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandkeep"
version = "0.1.0"
description = "Run Claude Code agents in isolated, disposable sandboxes — one per task, with cheap rollback and a human gate."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "George Goosen", email = "info@elusivecoffee.com.au" }]
keywords = ["claude", "agents", "sandbox", "isolation", "orchestration", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
]
# Stdlib-first by design (see BUILD_SPEC). No runtime dependencies in Phase 0–1.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sandkeep = "sandkeep.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/<your-org>/sandkeep"
Repository = "https://github.com/<your-org>/sandkeep"
Issues = "https://github.com/<your-org>/sandkeep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sandkeep"]

[tool.hatch.build.targets.wheel.force-include]
# repo-root resource dirs (BUILD_SPEC §1) bundled into installed wheels;
# config.resource_path() resolves them in both layouts
"sandbox_image" = "sandkeep/sandbox_image"
"prompts" = "sandkeep/prompts"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
