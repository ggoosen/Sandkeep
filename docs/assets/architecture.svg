  <text x="185" y="500" font-size="11.5" fill="#8893a3" text-anchor="middle" font-weight="600">agents own the code.</text>
  <text x="185" y="522" font-size="10.5" fill="#8893a3" text-anchor="middle" font-weight="400">The controller is deterministic and</text>
  <text x="185" y="544" font-size="10.5" fill="#8893a3" text-anchor="middle" font-weight="400">never runs agent-generated code.</text>
