  <text x="40" y="34" font-size="23" font-weight="700" fill="#e9eef5">Sandkeep</text>
  <text x="158" y="34" font-size="15" font-weight="600" fill="#eb6c36">isolate → review → gate</text>
  <text x="40" y="54" font-size="13" fill="#8b97a6">Run Claude Code agents in disposable sandboxes — one per task. Only a reviewed diff returns; nothing touches your repo until a human accepts.</text>
  <rect x="30" y="60" width="310" height="565" rx="12" fill="#10151c" fill-opacity="0.55" stroke="#33404f" stroke-width="1.4"/>
